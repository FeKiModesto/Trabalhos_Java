spring.application.name=beer-guide

# Servidor
server.port=8080

# Banco de dados H2
spring.datasource.url=jdbc:h2:mem:beerguidedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cache
spring.cache.type=simple

# Actuator (expondo caches também - requisito do PDF)
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# Info do aplicativo (requisito do PDF)
info.app.name=Beer Guide API
info.app.version=1.0.0
info.app.description=Guia de Cervejas Artesanais

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Desabilitar warning
spring.jpa.open-in-view=false